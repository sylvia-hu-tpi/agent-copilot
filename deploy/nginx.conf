# TLS 終端 ＋ 反向代理 —— docs/ARCHITECTURE.md §16.1 的兩個前提都落在這一份檔案：
#   前提 1：瀏覽器到本服務 MUST 是 HTTPS。session cookie 的 Secure 旗標是建置期決定，
#           純 HTTP 下瀏覽器會丟掉 cookie，症狀是「OTP 驗證成功但下一頁又回到登入」。
#   前提 2：對 /api/stream 關閉回應緩衝、read timeout 遠大於 25 秒心跳
#           （shared/types/events.ts 的 STREAM_HEARTBEAT_MS）。代理一開緩衝，
#           SSE 會連得上但永遠收不到事件，且不報錯。
#
# 掛載為 /etc/nginx/conf.d/default.conf（http 區塊內），憑證掛在 /etc/nginx/certs/。

upstream agent_copilot {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # ── SSE（§16.1 前提 2）—— 這個 location 的每一行都是「拿掉就靜默失效」的等級 ──
    location = /api/stream {
        proxy_pass http://agent_copilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 心跳 25 秒；設成小時級，讓連線壽命由應用端決定而不是代理
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── 其餘 API 與 SPA 靜態檔 ──
    location / {
        proxy_pass http://agent_copilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 摘要／結案等 AI 呼叫在平台側可能跑到數十秒（知識庫檢索上限 30 秒），要高於應用端自己的逾時
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
